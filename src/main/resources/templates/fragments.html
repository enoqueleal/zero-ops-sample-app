<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Zero Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        coollabs: {
                            50: '#f5f0ff',
                            DEFAULT: '#6b16ed',
                            100: '#7317ff',
                            200: '#5a12c7',
                            300: '#4a0fa3',
                        },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<!-- ── Shared small components ──────────────────────────────────────── -->

<svg th:fragment="logoIcon(sizeClass, size)" xmlns="http://www.w3.org/2000/svg" th:width="${size}" th:height="${size}" fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:class="${sizeClass}" viewBox="0 0 24 24">
    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
    <circle cx="12" cy="13" r="4"/>
</svg>

<svg th:fragment="checkIcon(sizeClass)" xmlns="http://www.w3.org/2000/svg" th:class="${sizeClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
</svg>

</body>
</html>
